# Repo-level task runner (https://taskfile.dev). `task` lists everything;
# Go-specific tasks live in apps/api/Taskfile.yml and are namespaced `api:`.
version: '3'

includes:
  api:
    taskfile: apps/api/Taskfile.yml
    dir: apps/api

vars:
  COMPOSE: podman compose -f infra/compose/docker-compose.dev.yml

tasks:
  default:
    cmds: [task --list]
    silent: true

  dev:up:
    desc: Start Postgres, Redis, MinIO, asynqmon for development
    cmds: ["{{.COMPOSE}} up -d"]

  dev:down:
    desc: Stop development infrastructure (data is kept)
    cmds: ["{{.COMPOSE}} down"]

  dev:reset:
    desc: Stop development infrastructure and wipe its data
    cmds: ["{{.COMPOSE}} down -v"]

  dev:ip:
    desc: Write this machine's LAN IP into dev configs for a phone (task dev:ip -- <ip> to override)
    cmds: ["bash infra/scripts/dev-ip.sh {{.CLI_ARGS}}"]

  dev:ps:
    desc: Show development containers and their ports
    cmds: ["{{.COMPOSE}} ps"]

  dev:logs:
    desc: Follow container logs (task dev:logs -- postgres)
    cmds: ["{{.COMPOSE}} logs -f --tail=100 {{.CLI_ARGS}}"]

  mobile:build:dev:
    desc: "EAS: Android development build (APK with dev client, connects to Metro)"
    dir: apps/mobile
    cmds: ["pnpm exec eas build --platform android --profile development {{.CLI_ARGS}}"]

  mobile:build:apk:
    desc: "EAS: standalone Android APK to share with the group (set EXPO_PUBLIC_API_URL in eas.json first)"
    dir: apps/mobile
    cmds: ["pnpm exec eas build --platform android --profile preview {{.CLI_ARGS}}"]

  gen:
    desc: Regenerate everything derived from Go (sqlc, OpenAPI, packages/shared, api-client)
    cmds:
      - task: api:gen
      - pnpm -F @heatseeker/api-client generate

  check:
    desc: Lint, typecheck and test the whole repo
    cmds:
      - task: api:check
      - pnpm lint
      - pnpm typecheck
      - pnpm test
