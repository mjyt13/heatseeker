name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: Go core
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: heatseeker
          POSTGRES_PASSWORD: heatseeker
          POSTGRES_DB: heatseeker
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U heatseeker"
          --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum
      - name: sqlc generated code is up to date
        uses: sqlc-dev/setup-sqlc@v4
        with:
          sqlc-version: "1.31.1"
      - run: sqlc diff
      - run: go build ./...
      - run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.13
          working-directory: apps/api
      - run: go test ./...
      - name: integration tests
        env:
          TEST_DATABASE_URL: postgres://heatseeker:heatseeker@localhost:5433/heatseeker?sslmode=disable
        run: go test -tags integration -count=1 ./internal/bootstrap/
      - name: generated artifacts are committed
        run: |
          go run ./cmd/heatseeker gen all
          git diff --exit-code -- openapi ../../packages/shared/src/generated

  web:
    name: JS workspaces
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: api-client is generated from the committed OpenAPI document
        run: |
          pnpm -F @heatseeker/api-client generate
          git diff --exit-code -- packages/api-client/src/schema.d.ts
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
